bundle:
  name: minha-torre

sync:
  exclude:
    - "node_modules/**"
    - ".git/**"
    - ".databricks/**"
    - "**/*.pyc"
    - "**/__pycache__/**"

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name
  postgres_branch:
    description: Lakebase Postgres Branch Resource Name
  postgres_database:
    description: Lakebase Postgres Database Resource Name

resources:
  apps:
    app:
      name: "minha-torre"
      description: "A Databricks App powered by AppKit"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      host: https://dbc-86be5789-92c0.cloud.databricks.com

    variables:
      sql_warehouse_id: 8123be2436b64684
      genie_space_id: 01f1cf41902914e8827b2c692eae7af0
      genie_space_name: Farol · Diretoria + Contratos
      postgres_branch: projects/minha-torre/branches/production
      postgres_database: projects/minha-torre/branches/production/databases/databricks-postgres
